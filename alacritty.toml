[env]
TERM = "alacritty"

[terminal.shell]
program = "/usr/bin/zsh"
args = []

[font]
size = 13.0

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.bold_italic]
family = "JetBrainsMono Nerd Font"
style = "Bold Italic"

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Italic"

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[scrolling]
history = 50000

[window]
opacity = 0.8
decorations = "none"
dynamic_padding = true
startup_mode = "Windowed"

[window.padding]
x = 5
y = 5

[[keyboard.bindings]]
key = "Return"
mods = "Control|Shift"
action = "SpawnNewInstance"

[[keyboard.bindings]]
key = "Space"
mods = "Control|Shift"
action = "ToggleViMode"

[[hints.enabled]]
regex = "(ipfs:|ipns:|magnet:|mailto:|gemini://|gopher://|https://|http://|news:|ssh:|ftp://)[^\u0000-\u001F\u007F-\u009F<>\"\\s{-}\\\\⟨⟩`]+"
command = "xdg-open"
mouse.enabled = true
