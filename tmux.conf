# --- Prefix ---
# Unbind C-b and use Alt-a as prefix
unbind C-b
set -g prefix M-a
bind a send-prefix

# --- Config Reload ---
# Press prefix + r to reload
bind r source-file ~/.tmux.conf \; display "Reloaded!"

# --- Window & Pane Creation ---
# New windows/panes inherit current path
bind c new-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"

# --- Pane Navigation ---
# vim-style: h=left j=down k=up l=right
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# --- Pane Resize ---
# Repeatable with -r flag (hold prefix + key)
bind -r C-h resizep -L 10
bind -r C-j resizep -D 10
bind -r C-k resizep -U 10
bind -r C-l resizep -R 10

# --- Window Management ---
# Renumber windows when one is closed
bind < swap-window -d -t -1
bind > swap-window -d -t +1
bind C-w choose-window 'swap-window -t %%'
bind C-l select-window -l
bind C-s command-prompt -p ssh: "new-window -n %1 'ssh %1'"
set -g renumber-windows on

# --- Copy Mode ---
# Use vi keybindings
setw -g mode-keys vi

# System clipboard via external tool (xclip/wl-copy) — tmux 3.3+ default, explicit for clarity
set -g set-clipboard external

# --- Terminal Settings ---
# alacritty with true color and extended keys
set -g default-terminal "alacritty"
set -as terminal-overrides ',alacritty:Tc,RGB'
set -as terminal-features ',alacritty:extkeys'

# --- Extended Keys ---
# CSI-u encoding for modern terminal apps
set -g extended-keys on
set -g extended-keys-format csi-u

# --- Input Responsiveness ---
# 10ms escape-time prevents input lag in vim
set -sg escape-time 10
set -g focus-events on

# --- History & Display ---
# 50K scrollback, 2s display time
set -g history-limit 50000
set -g display-time 2000
set -g display-panes-time 2000

# --- Activity Monitoring ---
# Highlight window with background activity
setw -g monitor-activity on
set -g visual-activity off

# --- Mouse & Titles ---
# Enable mouse support and window titles
set -g mouse on
set -g set-titles on
set -g set-titles-string "#T"
setw -g aggressive-resize on

# --- Visual ---
# Pane borders and message styling
set -g pane-border-style fg=colour240
set -g pane-active-border-style fg=colour33
set -g message-style fg=colour16,bg=colour252,bold

# --- Status Bar ---
# Customize status bar appearance
set -g status-interval 5
set -g status-style 'bg=black,fg=white'
set -g status-justify centre
set -g status-left '#[fg=green][#[fg=cyan]#S#[fg=green]]'
set -g status-left-length 20
setw -g automatic-rename off
setw -g window-status-format '#[dim]#I:#[default]#F#W#[fg=grey,dim]'
setw -g window-status-current-format '#[fg=cyan,bold]#I#[fg=blue]:#[fg=cyan]#F#W#[fg=dim]'
set -g status-right '#[fg=green][#[fg=cyan]#H %H:%M:%S %m-%d#[fg=green]]'
