# ============================================================================
# Hyprland Configuration
# Replaces: awesome/ (rc.lua, keybindings.lua, widgets.lua, xrandr.lua, config.lua)
# ============================================================================

# ---- Monitor ----------------------------------------------------------------
# 14" ThinkPad T14 internal + 27" 4K external (Redmi)
# Auto-detect: HDMI hotplug handled automatically; unplugged = only eDP-1
monitor = eDP-1,preferred,auto,1
monitor = HDMI-A-1,preferred,auto-right,1.5

# ---- Environment ------------------------------------------------------------
env = XCURSOR_SIZE,24
env = XCURSOR_THEME,Adwaita

# Input Method — Rime via Fcitx5
env = GTK_IM_MODULE,fcitx
env = QT_IM_MODULE,fcitx
env = XMODIFIERS,@im=fcitx
env = SDL_IM_MODULE,fcitx
env = GLFW_IM_MODULE,ibus

# GTK / Qt Wayland
env = GDK_BACKEND,wayland,x11
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1

# Native Wayland for Electron apps (Chrome, etc.)
env = ELECTRON_OZONE_PLATFORM_HINT,auto
env = NIXOS_OZONE_WL,1
env = _JAVA_AWT_WM_NONREPARENTING,1
env = MOZ_ENABLE_WAYLAND,1

# ---- Execute at launch ------------------------------------------------------
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = dbus-update-activation-environment --systemd DISPLAY WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = waybar
exec-once = mako
exec-once = swaybg -i ~/.config/hypr/wallpaper.jpg
exec-once = swayidle -w timeout 300 'swaylock -f' timeout 600 'hyprctl dispatch dpms off' resume 'hyprctl dispatch dpms on'
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = fcitx5 -d
exec-once = nextcloud --background
exec-once = blueman-applet
exec-once = telegram-desktop -startintray
exec-once = google-chrome-canary --enable-features=UseOzonePlatform --ozone-platform=wayland
exec-once = cliphist store

# ---- Input devices ----------------------------------------------------------
input {
    kb_layout = us
    repeat_rate = 40
    repeat_delay = 250
    follow_mouse = 1
    touchpad {
        natural_scroll = true
        tap-to-click = true
        tap-and-drag = true
        disable_while_typing = true
        clickfinger_behavior = true
    }
}

# ---- Gestures ---------------------------------------------------------------
gestures {
    workspace_swipe = true
    workspace_swipe_fingers = 3
}

# ---- General ----------------------------------------------------------------
general {
    gaps_in = 5
    gaps_out = 8
    border_size = 2
    col.active_border = rgba(33ccffee) rgba(0077ff88) 45deg
    col.inactive_border = rgba(595959aa)
    layout = dwindle  # dynamic tiling, closest to awesome's fair layout
    resize_on_border = true
    extend_border_grab_area = 15
}

# ---- Decoration -------------------------------------------------------------
decoration {
    rounding = 8
    blur {
        enabled = true
        size = 4
        passes = 2
        new_optimizations = true
        ignore_opacity = false
        noise = 0.01
        contrast = 0.9
        brightness = 0.9
        vibrancy = 0.2
        popups = true
        popups_ignorealpha = 0.2
    }
    shadow {
        enabled = true
        range = 6
        render_power = 2
        color = rgba(1a1a2e88)
    }
}

# ---- Animations -------------------------------------------------------------
animations {
    enabled = true
    bezier = wind, 0.05, 0.9, 0.1, 1.05
    bezier = winIn, 0.1, 1.0, 0.1, 1.1
    bezier = winOut, 0.0, 0.0, 0.2, 1.0
    bezier = liner, 1.0, 1.0, 1.0, 1.0
    animation = windows, 1, 6, wind, slide
    animation = windowsIn, 1, 6, winIn, slide
    animation = windowsOut, 1, 5, winOut, slide
    animation = windowsMove, 1, 5, wind, slide
    animation = fade, 1, 4, liner
    animation = fadeDim, 1, 5, liner
    animation = workspaceChange, 1, 4, liner
    animation = border, 1, 5, liner
}

# ---- Layout (dwindle) -------------------------------------------------------
dwindle {
    pseudotile = true
    preserve_split = true
    force_split = 0
    special_scale_factor = 0.8
    split_width_multiplier = 1.0
    no_gaps_when_only = true
    smart_split = false
    smart_resizing = true
}

# ---- Window rules -----------------------------------------------------------
windowrule = float, title:^(Picture-in-Picture)$
windowrule = float, title:^(Volume Control)$
windowrule = float, class:^(pavucontrol)$
windowrule = float, class:^(nm-connection-editor)$
windowrule = float, class:^(blueman-manager)$
windowrule = float, class:^(org.gnome.Calculator)$
windowrule = float, title:^(Firefox — Sharing Indicator)$
windowrule = noblur, class:^(swaybg)$
windowrule = noblur, class:^(waybar)$
windowrule = workspace 1 silent, class:^(google-chrome-canary)$
windowrule = workspace 2 silent, class:^(Alacritty)$
windowrule = workspace 3 silent, class:^(telegram-desktop)$

# ---- Keybindings ------------------------------------------------------------
$main = SUPER

# Terminal / launcher
bind = $main, T, exec, alacritty
bind = $main, D, exec, wofi --show drun

# Screenshots (hyprshot wraps grim+slurp)
bind = , Print, exec, hyprshot -m region
bind = $main, Print, exec, hyprshot -m window
bind = $main SHIFT, Print, exec, hyprshot -m output

# Clipboard manager
bind = $main, V, exec, cliphist list | wofi --dmenu | cliphist decode | wl-copy

# Focus (hjkl = d u l r)
bind = $main, J, movefocus, d
bind = $main, K, movefocus, u
bind = $main, H, movefocus, l
bind = $main, L, movefocus, r

# Move window (Shift + hjkl)
bind = $main SHIFT, J, movewindow, d
bind = $main SHIFT, K, movewindow, u
bind = $main SHIFT, H, movewindow, l
bind = $main SHIFT, L, movewindow, r

# Workspace switching (1-9)
bind = $main, 1, workspace, 1
bind = $main, 2, workspace, 2
bind = $main, 3, workspace, 3
bind = $main, 4, workspace, 4
bind = $main, 5, workspace, 5
bind = $main, 6, workspace, 6
bind = $main, 7, workspace, 7
bind = $main, 8, workspace, 8
bind = $main, 9, workspace, 9

# Move window to workspace (Shift + 1-9)
bind = $main SHIFT, 1, movetoworkspace, 1
bind = $main SHIFT, 2, movetoworkspace, 2
bind = $main SHIFT, 3, movetoworkspace, 3
bind = $main SHIFT, 4, movetoworkspace, 4
bind = $main SHIFT, 5, movetoworkspace, 5
bind = $main SHIFT, 6, movetoworkspace, 6
bind = $main SHIFT, 7, movetoworkspace, 7
bind = $main SHIFT, 8, movetoworkspace, 8
bind = $main SHIFT, 9, movetoworkspace, 9

# Scroll through workspaces
bind = $main, mouse_down, workspace, e+1
bind = $main, mouse_up, workspace, e-1

# Special workspace (scratchpad)
bind = $main, S, togglespecialworkspace
bind = $main SHIFT, S, movetoworkspace, special

# Window management
bind = $main, Q, killactive
bind = $main, F, fullscreen
bind = $main, SPACE, togglefloating
bind = $main, P, pseudo
bind = $main, TAB, cyclenext
bind = $main, R, submap, resize
bind = $main SHIFT, Q, exit

# Lock screen
bind = $main, X, exec, swaylock -f
bind = $ctrl $alt, DELETE, exec, swaylock -f

# Volume (media keys)
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# Brightness
bindel = , XF86MonBrightnessUp, exec, brightnessctl s 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl s 5%-

# --- Resize Submap ---
submap = resize
binde = , left, resizeactive, -10 0
binde = , right, resizeactive, 10 0
binde = , up, resizeactive, 0 -10
binde = , down, resizeactive, 0 10
bind = , escape, submap, reset
bind = , Return, submap, reset
submap = reset

# ---- Misc -------------------------------------------------------------------
misc {
    disable_autoreload = true
    enable_swallow = true
    swallow_regex = ^(Alacritty)$
    focus_on_activate = true
    animate_manual_resizes = true
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
    vfr = true
}

# ---- XWayland ---------------------------------------------------------------
xwayland {
    enabled = true
}