# hyprlock — 锁屏配置（Nord 配色，壁纸毛玻璃背景）
# 参考: https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock/

general {
    # 忽略空密码直接解锁
    ignore_empty_input = true
    # 隐藏鼠标光标
    hide_cursor = true
}

# ---- 背景：壁纸 + 毛玻璃模糊 ----
background {
    monitor =
    path = /home/luke/.config/hypr/wallpaper.jpg
    color = rgba(46, 52, 64, 1.0)

    # 毛玻璃模糊参数
    blur_passes = 3
    blur_size = 8
    noise = 0.02
    contrast = 1.0
    brightness = 0.75          # 稍微压暗，突出前景
    vibrancy = 0.2
    vibrancy_darkness = 0.0
}

# ---- 时钟（大号，带投影）----
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(236, 239, 244, 1.0)          # nord6
    font_family = JetBrainsMono Nerd Font ExtraBold
    font_size = 96

    position = 0, 90
    halign = center
    valign = center

    shadow_passes = 2
    shadow_size = 8
    shadow_color = rgba(46, 52, 64, 0.6)
}

# ---- 日期（时钟下方）----
label {
    monitor =
    text = cmd[update:1000] date +"%A, %B %d"
    color = rgba(143, 188, 187, 1.0)          # nord7
    font_family = JetBrainsMono Nerd Font
    font_size = 24

    position = 0, 40
    halign = center
    valign = center

    shadow_passes = 1
    shadow_size = 4
    shadow_color = rgba(46, 52, 64, 0.6)
}

# ---- 密码输入框 ----
input-field {
    monitor =
    size = 320, 60
    outline_thickness = 2
    rounding = 12

    dots_size = 0.18
    dots_spacing = 0.20
    dots_center = true
    hide_input = true

    outer_color = rgba(76, 86, 106, 1.0)      # nord3
    inner_color = rgba(46, 52, 64, 0.80)      # nord0
    font_color = rgba(216, 222, 233, 1.0)     # nord4

    # 验证中（密码正确）
    check_color = rgba(143, 188, 187, 1.0)    # nord7
    # 密码错误
    fail_color = rgba(191, 97, 106, 1.0)      # nord11
    # Caps Lock 激活
    capslock_color = rgba(235, 203, 139, 1.0) # nord13

    fade_on_empty = true
    placeholder_text = <span foreground="##9da4b4"><i>输入密码解锁</i></span>

    position = 0, -70
    halign = center
    valign = center
}

# ---- 左下角提示（当前用户）----
label {
    monitor =
    text = cmd[update:1000] echo -n $USER
    color = rgba(165, 174, 192, 1.0)
    font_family = JetBrainsMono Nerd Font
    font_size = 16

    position = 40, 20
    halign = left
    valign = bottom
}
